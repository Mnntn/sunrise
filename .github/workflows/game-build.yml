name: game build
# Builds the game for every platform from `ref`: the Java exporters, then Linux and the Linux server, Windows x64
# and ARM64 on GitHub, and macOS on the Mac mini's runner with a 1500-frame offscreen run of a new world (smoke-test.json): Apple
# Silicon, and Intel cross-built and signed there for x86_64-apple-darwin (#1161), startup checks only, in
# macos-x64-intel on native Intel (#1602). Called by
# release.yml (the releases) and nightly-build.yml (the opt-in Nightly), always from main's copy of this file: the
# caller's commit, never the one being built. It holds no secrets: signing the checksums is the callers' own job,
# which never runs what this one built. Linux artifacts always build on Ubuntu 22.04; optional Dyna runners
# compile portable Java exporter classes and smoke the downloaded hosted Linux artifact with private data.
# See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (SUNRISE_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      kind:
        description: Build channel; snapshots require only SDK-supported platforms
        type: string
        default: release
      nightly:
        description: A nightly's "<date> <short sha>" (SUNRISE_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # Only release.yml says true: it builds main. A nightly can hold pull requests nobody reviewed yet, whose
        # build scripts and tests run here and could rewrite target/, the cargo home or a compiler cache. So an
        # untrusted build never runs on the release runner, never saves the Rust cache (its key is its own anyway),
        # and a trusted one never reads the machine's shared sccache, which pull requests' jobs write
        # (tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
      developer_id:
        description: Sign the macOS programs with Developer ID and notarize the zip (the runner's keychain)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  runner-configuration:
    # Every leg waits for this check: on Dyna's small runner while the repository's switch is on (the events its
    # runners take), so a build never queues behind GitHub's runners first.
    runs-on: ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'dyna-small' || 'ubuntu-latest' }}
    steps:
      - name: Require a dedicated trusted release runner
        if: inputs.trusted && vars.MAC_RUNNER == ''
        run: |
          echo '::error::MAC_RUNNER must name a dedicated release runner before trusted builds can run.'
          exit 1
  exporters:
    needs: runner-configuration
    # This runner holds the maintainer's own pinned Minecraft jars. Only our classes leave it. An untrusted build
    # goes to the Mac mini's nightly runner (macOS + sunrise-nightly: ludovics-mac-mini-nightly, beside the one that
    # runs by-hand game tools), never the release runner (MAC_RUNNER: ludovics-mac-mini-release).
    # toJSON keeps an empty trusted runner as an invalid empty label, never a Nightly fallback.
    runs-on: ${{ fromJSON(inputs.trusted && toJSON(vars.MAC_RUNNER) || (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_EXPORTERS_RUNNER) || (vars.SELF_HOSTED_CI != 'off' && '["self-hosted", "macOS", "sunrise-nightly"]') || '"ubuntu-latest"') }}
    # Three full preparations (two isolated, one batched) besides the compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          # wasm-std uses -Zbuild-std even when this pinned toolchain is already installed.
          components: rust-src, rustfmt
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted' || runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '25'
      - if: runner.environment == 'self-hosted'
        run: |
          if [[ -z "${DYNA_CI_BUILD:-}" ]]; then bash tools/ci/runner-env.sh; fi
        env:
          SUNRISE_NO_SCCACHE: ${{ inputs.trusted && '1' || '' }}
      - name: Build the shared wasm standard library
        shell: bash
        run: |
          cargo run --locked -p cargo-sunrise-mod -- sunrise-mod wasm-std sunrise-wasm-std.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-std
          path: sunrise-wasm-std.wasm
          if-no-files-found: error
      - name: Private exporter inputs
        run: |
          if [[ -n "${DYNA_CI_BUILD:-}" ]]; then
            SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
          else
            bash tools/ci/vanilla-data.sh
          fi
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it
          # prepares afresh.
          cargo build --release --locked -p sunrise-prepare
          preparer="${CARGO_TARGET_DIR:-target}/release/sunrise-prepare"
          # Compiled here, never taken from the runner's shared preparations: other game jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$("$preparer" compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/sunriselab/parity/*' -o -path 'exporters/client/dev/sunriselab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary "$preparer"
      - uses: actions/upload-artifact@v7
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [runner-configuration, exporters]
    name: build ${{ matrix.name }}
    # Windows ARM64 and musl stay optional. Snapshots also leave Intel macOS optional: only the SDK's
    # platforms are required there. Nightlies and releases retain their existing Intel macOS requirement.
    # Optional failed legs still run; signing omits their absent archives, and snapshot notes name them.
    # continue-on-error covers a failure only: a leg that times out or is cancelled ends `cancelled`, and so does
    # this job's result. The legs job below decides from the legs that finished, so callers wait on it instead.
    continue-on-error: ${{ (github.repository == 'sunrise-org/sunrise' && matrix.mac == true) || matrix.name == 'windows-arm64' || matrix.name == 'linux-musl' || (inputs.kind == 'snapshot' && matrix.name == 'macos-x64') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: sunrise-linux-x86_64
            asset: sunrise-linux-x86_64.tar.gz
            # The server build too: packaging/server/install.sh installs it on Linux.
            server_dir: sunrise-server-linux-x86_64
            server_asset: sunrise-server-linux-x86_64.tar.gz
          - name: linux-musl
            os: ubuntu-22.04
            musl: true
            dir: sunrise-linux-musl-x86_64
            asset: sunrise-linux-musl-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: sunrise-windows-x64
            asset: sunrise-windows-x64.zip
            exe: .exe
            pe_arch: x64
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            dir: sunrise-windows-arm64
            asset: sunrise-windows-arm64.zip
            exe: .exe
            pe_arch: arm64
            # The ARM64 runner builds and runs native ARM64 executables; keep the C runtime in the archive.
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            target: aarch64-apple-darwin
            dir: sunrise-macos-arm64
            asset: sunrise-macos-arm64.zip
          # Intel Macs: built and signed on the same runner for another target. Its programs are started on real
          # Intel hardware by macos-x64-intel below, not here: under Rosetta 2 the main-thread stack check fails
          # (#1602). The archive goes up as untested-<asset>, which only that job republishes under its name.
          - name: macos-x64
            mac: true
            target: x86_64-apple-darwin
            dir: sunrise-macos-x64
            asset: sunrise-macos-x64.zip
            started_on_intel: true
    runs-on: ${{ matrix.mac && fromJSON(inputs.trusted && toJSON(vars.MAC_RUNNER) || (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_MAC_RUNNER) || (vars.SELF_HOSTED_CI != 'off' && '["self-hosted", "macOS", "sunrise-nightly"]') || '"macos-15"') || matrix.os }}
    # The fork's cold client + headless builds need both feature variants; keep upstream's limits unchanged.
    # GitHub's macOS runner builds Sunrise's game cold: 60 minutes ran out mid-build (nightly dry run
    # 43813225420), and a timed-out job counts as cancelled, which continue-on-error does not cover, so the
    # whole build stopped before signing. The musl leg, built in Alpine on a hosted runner, took 53 minutes in
    # nightly dry run 43838074073 and ran out at 60 in nightly 43869408636, cancelling it the same way.
    timeout-minutes: ${{ github.repository == 'sunrise-org/sunrise' && ((matrix.mac || matrix.musl) && 100 || 60) || (matrix.mac && 60 || 40) }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The release's version, built in (sunrise_core::release): --version, user agents and crash reports
      # say it. No version-bump commits.
      SUNRISE_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      SUNRISE_NIGHTLY: ${{ inputs.nightly }}
      # Where cargo puts the programs: target/release, or target/<target>/release for another target.
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout, the Mac mini's runner too: its work folder is shared with pull requests'
          # parity jobs, and nothing they leave (target/, an untracked .cargo/config.toml, a build script's output)
          # may end up in a release. target/ is rebuilt from scratch; .local/ is relinked by vanilla-data.sh, which
          # keeps its preparations outside the checkout.
          clean: true
      - name: Workflow-owned validation tools
        # Every matrix leg reads the Rust pin below, not only Linux and self-hosted legs.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/check_glibc.py
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted' && !matrix.musl
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        with:
          distribution: temurin
          java-version: '25'
      - name: The programs this commit's release folder takes
        # From the checked-out commit's own list, so a nightly or snapshot of an older commit builds what its packager wants.
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          list=crates/sunrise-mod-package/src/sdk/inputs.json
          programs=""
          if [[ -f "$list" ]]; then
            programs=$(${{ runner.os == 'Windows' && 'python' || 'python3' }} -c "import json, sys; listed = json.load(open(sys.argv[1])).get('routes', {}).get('package', {}).get('program'); print('-' if listed is None else ' '.join(p for p in listed if not p.endswith('.wasm')))" "$list" | tr -d '\r')
          fi
          # No list or no package route: the programs every release folder took before the list existed.
          if [[ -z "$programs" || "$programs" == "-" ]]; then
            programs="sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack"
          fi
          build=""
          for program in $programs; do
            case "$program" in
              sunrise-ctl) build="$build -p sunrise-client-lib --bin sunrise-ctl" ;;
              *) build="$build -p $program --bin $program" ;;
            esac
          done
          echo "PROGRAMS=sunrise-client $programs" >> "$GITHUB_ENV"
          echo "BUILD_PROGRAMS=$build" >> "$GITHUB_ENV"
      - name: Build the official game and the programs its release folder takes
        if: ${{ !matrix.musl }}
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -p sunrise-official --bin sunrise-official $BUILD_PROGRAMS
      - name: The official game is the game players get, under its name
        # sunrise-official: sunrise-client's game with Sunrise's own parts plugged in (docs/layers.md, "How a
        # Sunrise crate plugs in"). Everything below, the launcher and players know it as sunrise-client.
        if: ${{ !matrix.musl }}
        run: cp -f "$BIN/sunrise-official${{ matrix.exe }}" "$BIN/sunrise-client${{ matrix.exe }}"
      - name: Every program the release folder takes was built
        if: ${{ !matrix.musl }}
        run: |
          for binary in $PROGRAMS; do
            test -f "$BIN/$binary${{ matrix.exe }}" || { echo "::error::$BIN/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        run: |
          python tools/check_pe_arch.py "${{ matrix.pe_arch }}" \
            $(for binary in $PROGRAMS; do echo "$BIN/$binary${{ matrix.exe }}"; done)
      - name: Rosetta for the Intel build on Apple Silicon
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify macOS executable architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}
        run: |
          for binary in $PROGRAMS; do
            actual=$(lipo -archs "$BIN/$binary")
            [[ "$actual" == "$EXPECTED_ARCH" ]] || { echo "::error::$binary is $actual, expected $EXPECTED_ARCH"; exit 1; }
          done
      - name: The signing keychain, unlocked
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/keychain.sh unlock
      - name: Signed with Developer ID and the hardened runtime
        # Before the checks below, so they run the programs as players will.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          for binary in $PROGRAMS; do
            codesign --force --options runtime --timestamp --keychain "$MACOS_SIGN_KEYCHAIN" \
              --identifier "dev.sunrise.${binary#sunrise-}" --sign "$MACOS_SIGN_IDENTITY" "$BIN/$binary"
            codesign --verify --strict --verbose=2 "$BIN/$binary"
          done
      - name: Only system libraries
        if: ${{ !matrix.musl }}
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the standard
        # loader and libraries every desktop distribution has. macOS: only the system's own libraries.
        run: |
          for binary in $PROGRAMS; do
            file="$BIN/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$file"
            fi
          done
      - name: Baseline x86-64 CPUs only
        # No POPCNT or LZCNT at all (the script says why only those): a C library's count intrinsic killed the
        # game before main on a Core 2 (#7264). Not the Mac builds: every Intel Mac that runs macOS 11 has both.
        if: runner.os != 'macOS' && matrix.pe_arch != 'arm64' && !matrix.musl
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_cpu_baseline.py \
            $(for binary in $PROGRAMS; do echo "$BIN/$binary${{ matrix.exe }}"; done)
      - name: Linux glibc baseline (Ubuntu 22.04)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          python3 .workflow-tools/tools/check_glibc.py \
            $(for binary in $PROGRAMS; do echo "$BIN/$binary"; done)
      - name: macOS main-stack diagnostics
        if: runner.os == 'macOS'
        run: |
          echo "LC_MAIN of sunrise-client:"
          otool -l "$BIN/sunrise-client" | grep -A4 LC_MAIN || true
          if [[ "$(lipo -archs "$BIN/sunrise-client")" == x86_64 ]]; then
            translated=$(arch -x86_64 /usr/sbin/sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            stack_limit=$(arch -x86_64 /bin/sh -c 'ulimit -s' || true)
          else
            translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            stack_limit=$(ulimit -s || true)
          fi
          echo "sysctl.proc_translated (sunrise-client architecture): $translated"
          echo "ulimit -s (sunrise-client architecture): $stack_limit"
          echo "Runner uname -m:"
          uname -m || true
          echo "Runner arch:"
          arch || true
      - name: Every program starts
        if: ${{ !matrix.musl && !matrix.started_on_intel }}
        run: |
          set -euo pipefail
          bin=$BIN
          "$bin/sunrise-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/sunrise-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/sunrise-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in sunrise-prepare sunrise-server sunrise-port-pack; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $SUNRISE_VERSION" ]] || { echo "::error::expected $binary $SUNRISE_VERSION"; exit 1; }
          done
      - name: Tools from the runner
        if: runner.environment == 'self-hosted'
        env:
          SUNRISE_NO_SCCACHE: ${{ inputs.trusted && '1' || '' }}
        run: |
          if [[ -z "${DYNA_CI_BUILD:-}" ]]; then bash tools/ci/runner-env.sh; fi
      - name: Resources prepared from the runner's own Minecraft
        if: runner.environment == 'self-hosted'
        run: |
          if [[ -n "${DYNA_CI_BUILD:-}" ]]; then
            SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
          else
            bash tools/ci/vanilla-data.sh
          fi
      - name: The game runs (offscreen, a new world, 1500 frames)
        if: runner.environment == 'self-hosted' && !matrix.started_on_intel
        run: bash .workflow-tools/tools/ci/game_smoke.sh
      # The separate Linux artifact smoke supplies the report when Dyna is enabled;
      # otherwise Apple Silicon supplies it. Intel has startup checks only, in macos-x64-intel.
      - uses: actions/upload-artifact@v7
        if: runner.environment == 'self-hosted' && matrix.name == 'macos' && (inputs.trusted || vars.DYNA_CI_SELF_HOSTED != 'true' || vars.NIGHTLY_LINUX_RUNNER == '')
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@v8
        with:
          name: original-exporters
          path: exporters
      # The wasm member is target-independent, including on musl and Windows.
      - uses: actions/download-artifact@v8
        with:
          name: wasm-std
          path: ${{ matrix.musl && 'target/x86_64-unknown-linux-musl/release' || env.BIN }}
      - name: Build, check and package for musl in Alpine
        if: matrix.musl
        # Run Docker on the Ubuntu host: JavaScript actions themselves require glibc.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e SUNRISE_VERSION -e SUNRISE_NIGHTLY \
            rust:alpine3.22 sh tools/ci/build-musl.sh
      - name: Package
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/sunrise-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          # Windows x64: Microsoft's DXC, pinned and checksummed, which DirectX 12 uses on integrated GPUs
          # (gfx/dx12_compiler.rs), with its licence. ARM64 keeps FXC (THIRD_PARTY_NOTICES.md says why).
          if [[ "${{ matrix.name }}" == windows ]]; then
            python tools/ci/fetch_dxc.py "dist/${{ matrix.dir }}"
          fi
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - name: Notarized
        # A zip of programs can't be stapled: Gatekeeper asks Apple the first time each one runs.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: |
          for binary in $PROGRAMS; do
            codesign --verify --strict "dist/${{ matrix.dir }}/$binary"
          done
          packaging/macos/notarize.sh "dist/${{ matrix.asset }}"
      # A file named like the Intel macOS asset comes only from macos-x64-intel: the publish job downloads every
      # artifact into one folder, so the untested archive carries its own file name too.
      - name: The Intel macOS archive, named untested until it starts on Intel
        if: matrix.started_on_intel
        run: mv "dist/${{ matrix.asset }}" "dist/untested-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.started_on_intel && 'untested-' || '' }}${{ matrix.asset }}
          path: dist/${{ matrix.started_on_intel && 'untested-' || '' }}${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The server build (the game without sound or controllers, as sunrise-engine)
        if: matrix.server_asset
        run: |
          set -euo pipefail
          # After the client is packaged: target/release/sunrise-client is rebuilt without the audio and
          # controllers features, so it needs neither libasound nor libudev (minimal server images lack them).
          cargo build --release --locked -p sunrise-game --no-default-features --bin sunrise-client
          cargo run --locked -p xtask -- package-server "$BIN/sunrise-client" "dist/${{ matrix.server_dir }}"
          folder="dist/${{ matrix.server_dir }}"
          python3 tools/check_imports.py --server "$folder/sunrise-engine" "$folder/sunrise-server" "$folder/sunrise-prepare"
          python3 .workflow-tools/tools/check_glibc.py "$folder/sunrise-engine" "$folder/sunrise-server" "$folder/sunrise-prepare"
          "$folder/sunrise-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/sunrise-server" --version)" == "sunrise-server $SUNRISE_VERSION" ]]
          cd dist
          rm -f "${{ matrix.server_asset }}"
          tar czf "${{ matrix.server_asset }}" "${{ matrix.server_dir }}"
          ls -l "${{ matrix.server_asset }}"
      - uses: actions/upload-artifact@v7
        if: matrix.server_asset
        with:
          name: ${{ matrix.server_asset }}
          path: dist/${{ matrix.server_asset }}
          if-no-files-found: error
          retention-days: 3
      # The leg's last step: legs below counts a leg as built only once this marker exists. The Intel macOS
      # leg's marker is macos-x64-intel's, once its programs started.
      - name: This leg built
        if: ${{ !matrix.started_on_intel }}
        run: echo built > "$RUNNER_TEMP/leg-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        if: ${{ !matrix.started_on_intel }}
        with:
          name: leg-${{ matrix.name }}
          path: ${{ runner.temp }}/leg-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: packaging/macos/keychain.sh lock

  # Whether the build is complete: every required leg left its marker. An optional leg (build's continue-on-error)
  # that failed, timed out or was cancelled drops out alike; a cancelled run stops here.
  # #1602: the Intel macOS archive, built and signed with the others, started on real Intel hardware. It ships only
  # if its programs start here: this job republishes it under the name the sign job collects and leaves the leg's
  # marker. No keychain, secrets or publishing; if it fails, the archive drops out like any optional leg.
  macos-x64-intel:
    name: start the Intel macOS archive on Intel
    needs: build
    if: ${{ !cancelled() }}
    # Optional where the leg is (build's continue-on-error): a failure here drops x64 without turning the run red;
    # legs decides from the marker.
    continue-on-error: ${{ github.repository == 'sunrise-org/sunrise' || inputs.kind == 'snapshot' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUNRISE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: untested-sunrise-macos-x64.zip
          path: ${{ runner.temp }}/intel
      - name: Unpack the signed archive, unchanged
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/intel/untested-sunrise-macos-x64.zip" "$RUNNER_TEMP/intel"
          echo "BIN=$RUNNER_TEMP/intel/sunrise-macos-x64" >> "$GITHUB_ENV"
      - name: Every program starts, on Intel
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 && "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" == 0 ]] \
            || { echo "::error::not a native Intel runner"; exit 1; }
          "$BIN/sunrise-client" --help | grep -q -- '--resources'
          "$BIN/sunrise-ctl" --help > /dev/null
          "$BIN/sunrise-prepare" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in sunrise-prepare sunrise-server; do
            out=$("$BIN/$binary" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $SUNRISE_VERSION" ]] || { echo "::error::expected $binary $SUNRISE_VERSION"; exit 1; }
          done
      # The same bytes the build leg signed and notarized, under the asset's own name.
      - name: The archive, named as it ships
        run: |
          mkdir -p "$RUNNER_TEMP/ship"
          cp "$RUNNER_TEMP/intel/untested-sunrise-macos-x64.zip" "$RUNNER_TEMP/ship/sunrise-macos-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-macos-x64.zip
          path: ${{ runner.temp }}/ship/sunrise-macos-x64.zip
          if-no-files-found: error
          retention-days: 3
      - name: This leg built
        run: echo built > "$RUNNER_TEMP/leg-macos-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: leg-macos-x64
          path: ${{ runner.temp }}/leg-macos-x64
          if-no-files-found: error
          retention-days: 3

  legs:
    needs: [build, macos-x64-intel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        # No marker at all (every leg failed) is the next step's to report.
        continue-on-error: true
        with:
          pattern: leg-*
          path: legs
      - name: Every required leg built
        id: decide
        env:
          REPOSITORY: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
        run: |
          # The legs build's continue-on-error does not make optional.
          required=(linux windows)
          if [[ "$REPOSITORY" != sunrise-org/sunrise ]]; then
            required+=(macos)
            [[ "$KIND" == snapshot ]] || required+=(macos-x64)
          fi
          missing=()
          for leg in "${required[@]}"; do [[ -d "legs/leg-$leg" ]] || missing+=("$leg"); done
          for leg in linux linux-musl windows windows-arm64 macos macos-x64; do
            [[ -d "legs/leg-$leg" ]] || echo "::warning::build $leg did not finish"
          done
          if (( ${#missing[@]} )); then echo "::error::required legs did not build: ${missing[*]}"; exit 1; fi
          echo complete=true >> "$GITHUB_OUTPUT"
      # The caller reads this artifact, not a workflow output: a reusable workflow that ends failed or cancelled (an
      # optional leg that failed, timed out or got no runner) passes back no outputs at all.
      - name: The build is complete
        if: steps.decide.outputs.complete == 'true'
        run: echo complete > "$RUNNER_TEMP/build-complete"
      - uses: actions/upload-artifact@v7
        if: steps.decide.outputs.complete == 'true'
        with:
          name: build-complete
          path: ${{ runner.temp }}/build-complete
          if-no-files-found: error
          retention-days: 3

  linux-smoke:
    name: smoke hosted Linux artifact
    needs: [runner-configuration, legs]
    if: ${{ !cancelled() && needs.legs.result == 'success' && !inputs.trusted && vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_LINUX_RUNNER != '' }}
    # Dyna supplies private resources, never the libc used to compile shipped binaries.
    runs-on: ${{ fromJSON(vars.NIGHTLY_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: Workflow-owned smoke tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: sunrise-linux-x86_64.tar.gz
          path: ${{ runner.temp }}/hosted-linux
      - name: Unpack the hosted-built game, unchanged
        run: |
          tar xzf "$RUNNER_TEMP/hosted-linux/sunrise-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/hosted-linux"
          echo "BIN=$RUNNER_TEMP/hosted-linux/sunrise-linux-x86_64" >> "$GITHUB_ENV"
      - name: Private resources from the Dyna runner
        run: |
          : "${DYNA_CI_BUILD:?Linux smoke requires a Dyna private-data runner}"
          mkdir -p exporters
          cp -a "$BIN/exporters/." exporters/
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
      - name: The hosted artifact draws a world under Xvfb
        run: bash .workflow-tools/tools/ci/game_smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3

